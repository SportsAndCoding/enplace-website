<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4d06f"/>
      <stop offset="100%" stop-color="#c8a020"/>
    </linearGradient>
    <linearGradient id="tr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae49a"/>
      <stop offset="100%" stop-color="#f4d06f"/>
    </linearGradient>
    <linearGradient id="bl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8a020"/>
      <stop offset="100%" stop-color="#a07810"/>
    </linearGradient>
    <linearGradient id="br" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4d06f"/>
      <stop offset="100%" stop-color="#b08820"/>
    </linearGradient>
  </defs>
  <!-- Top-left -->
  <rect x="4"  y="4"  width="43" height="43" rx="8" fill="url(#tl)"/>
  <!-- Top-right (lighter — catches light, matches logo) -->
  <rect x="53" y="4"  width="43" height="43" rx="8" fill="url(#tr)"/>
  <!-- Bottom-left -->
  <rect x="4"  y="53" width="43" height="43" rx="8" fill="url(#bl)"/>
  <!-- Bottom-right -->
  <rect x="53" y="53" width="43" height="43" rx="8" fill="url(#br)"/>
</svg>
